<!--
IT Support Ticket System
-->
<!DOCTYPE html>
<html>
<head>
<title>Support Dashboard</title>
</head>

<body>

<h1>Support Dashboard</h1>
<button onclick="loadTickets()">Aktualisieren</button>

<div id="tickets"></div>

<script>
async function loadTickets(){
  const res = await fetch("/api/tickets");
  const data = await res.json();

  let html = "";

  data.forEach(t => {
    html += `
      <div>
        <b>${t.number}</b> - ${t.subject}<br>
        ${t.description}<br>
        Status: ${t.status}
        <hr>
      </div>
    `;
  });

  document.getElementById("tickets").innerHTML = html;
}

loadTickets();
</script>

</body>
</html>
