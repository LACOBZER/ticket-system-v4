<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ticket erstellen</title>
</head>
<body>

<h2>Ticket erstellen</h2>

<form id="form">
<input id="user" placeholder="Benutzer"><br>
<input id="customer" placeholder="Kunde"><br>
<input id="subject" placeholder="Anliegen"><br>
<textarea id="desc"></textarea><br>

<select id="priority">
<option value="low">Low</option>
<option value="medium">Medium</option>
<option value="high">High</option>
</select>

<button>Speichern</button>
</form>

<script>
document.getElementById("form").onsubmit = async e=>{
e.preventDefault();

await fetch("/api/tickets",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
number:"T-"+Date.now(),
participant:user.value,
customer:customer.value,
subject:subject.value,
description:desc.value,
priority:priority.value
})
});

alert("Ticket gespeichert");
}
</script>

</body>
</html>
