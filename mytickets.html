<h2>Meine Tickets</h2>

<input id="name">
<button onclick="load()">Suchen</button>

<div id="list"></div>

<script>
async function load(){
const res = await fetch("/api/tickets");
const data = await res.json();

list.innerHTML="";

data.filter(t=>t.participant===name.value)
.forEach(t=>{
list.innerHTML+=`<div>${t.number} - ${t.subject}</div>`;
});
}
</script>
