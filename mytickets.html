<!-- IT Support Ticket System -->
<!DOCTYPE html>
<html>
<body>

<h2>Meine Tickets</h2>

<input id="name">
<button onclick="load()">Suchen</button>

<div id="list"></div>

<script>
async function load(){
const res = await fetch("/api/tickets");
const data = await res.json();

const filtered = data.filter(t => t.participant === name.value);

let html="";
filtered.forEach(t=>{
html+=`<div>${t.number} - ${t.subject}</div>`;
});

list.innerHTML = html;
}
</script>

</body>
</html>
